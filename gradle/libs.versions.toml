####################################################################
# Version Catalog
#
# 규칙
#  - 섹션 순서는 [versions] / [libraries] / [plugins] 모두 동일하게 유지
#  - BOM이 관리하는 아티팩트는 version을 명시하지 않음 (compose, firebase)
#  - 같은 릴리스 그룹은 version 키 하나를 공유 (activity, lifecycle, coroutines 등)
####################################################################

[versions]

#--- 빌드 도구 / 언어 ------------------------------------------------
agp = "9.1.1"
kotlin = "2.2.20"
ksp = "2.3.6"                           # KSP2 독립 버전 (Kotlin 버전과 무관). 2.3.7+ 는 Kotlin 2.3 필요
ktlint = "14.2.0"                       # ktlint Gradle Plugin

#--- Kotlin 생태계 --------------------------------------------------
coroutines = "1.10.2"                   # coroutines core / android / test 공용
kotlinxSerializationJson = "1.9.0"      # 1.10+ 은 Kotlin 2.3 필요

#--- AndroidX 기본 --------------------------------------------------
coreKtx = "1.16.0"
appcompat = "1.7.1"
coreSplashscreen = "1.2.0"
androidx-activity = "1.13.0"            # activity-ktx / activity-compose 공용
androidx-lifecycle = "2.11.0"           # lifecycle-runtime-ktx / viewmodel-nav3 공용

#--- Compose --------------------------------------------------------
composeBom = "2026.06.01"               # compose 계열 버전은 전부 이 BOM이 관리

#--- Navigation 3 ---------------------------------------------------
navigation3 = "1.1.6"

#--- DI (Hilt) ------------------------------------------------------
hiltAndroid = "2.60.1"
hiltNavigationCompose = "1.2.0"

#--- 네트워크 --------------------------------------------------------
okhttp = "5.4.0"                        # okhttp / logging-interceptor / mockwebserver 공용
retrofit = "3.0.0"                      # okhttp 4.12.0 을 선언하지만 5.x 로 상향 해석됨
retrofit2KotlinxSerializationConverter = "1.0.0"

#--- 로컬 저장소 -----------------------------------------------------
datastore = "1.2.1"                     # DataStore Preferences
room = "2.7.2"                   # room runtime / ktx / compiler 공용

#--- Firebase -------------------------------------------------------
firebaseBom = "34.16.0"                 # firebase 계열 버전은 전부 이 BOM이 관리
crashlyticsPlugin = "3.0.7"
googleServices = "4.4.2"

#--- Google Play 서비스 ----------------------------------------------
playServicesAds = "25.4.0"              # AdMob
ossLicenses = "17.5.1"
ossLicensesPlugin = "0.13.0"

#--- 지도 (Naver) ----------------------------------------------------
mapSdk = "3.23.0"
naverMapCompose = "1.9.0"

#--- 테스트 ----------------------------------------------------------
junit = "4.13.2"
androidxTestExt = "1.2.1"


[libraries]

#--- Kotlin 생태계 --------------------------------------------------
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

#--- AndroidX 기본 --------------------------------------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }

#--- Compose (버전은 아래 BOM이 일괄 관리하므로 version 명시 안 함) -------
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity" }

#--- Navigation 3 ---------------------------------------------------
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-nav3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }

#--- DI (Hilt) ------------------------------------------------------
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hiltAndroid" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hiltAndroid" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

#--- 네트워크 --------------------------------------------------------
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit2-kotlinx-serialization-converter = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofit2KotlinxSerializationConverter" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

#--- 로컬 저장소 -----------------------------------------------------
androidx-datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

#--- Firebase (버전은 아래 BOM이 일괄 관리하므로 version 명시 안 함) ------
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }

#--- Google Play 서비스 ----------------------------------------------
play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "playServicesAds" }
oss-licenses = { group = "com.google.android.gms", name = "play-services-oss-licenses", version.ref = "ossLicenses" }

#--- 지도 (Naver) ----------------------------------------------------
map-sdk = { module = "com.naver.maps:map-sdk", version.ref = "mapSdk" }
naver-map-compose = { module = "io.github.fornewid:naver-map-compose", version.ref = "naverMapCompose" }

#--- build-logic (convention plugin 컴파일용) -------------------------
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

#--- 테스트 ----------------------------------------------------------
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

# Compose 테스트 (버전은 compose-bom이 관리)
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }


[plugins]

#--- 빌드 도구 / 언어 ------------------------------------------------
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }

#--- DI (Hilt) ------------------------------------------------------
daggerHilt = { id = "com.google.dagger.hilt.android", version.ref = "hiltAndroid" }

#--- Firebase / Google Play 서비스 -----------------------------------
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlyticsPlugin" }
oss-licenses = { id = "com.google.android.gms.oss-licenses-plugin", version.ref = "ossLicensesPlugin" }
